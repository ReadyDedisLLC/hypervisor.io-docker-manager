services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_3000:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/linkwarden
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000/api/v1/auth}
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${NEXT_PUBLIC_DISABLE_REGISTRATION:-false}
      NEXT_PUBLIC_CREDENTIALS_ENABLED: ${NEXT_PUBLIC_CREDENTIALS_ENABLED:-true}
      STORAGE_FOLDER: ${STORAGE_FOLDER:-data}
      NEXT_PUBLIC_MAX_FILE_SIZE: ${NEXT_PUBLIC_MAX_FILE_SIZE:-10485760}
      BROWSER_TIMEOUT: ${BROWSER_TIMEOUT:-5}
    volumes:
      - linkwarden_data:/data/data
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linkwarden
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  linkwarden_data:
  pgdata:
