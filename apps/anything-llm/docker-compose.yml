services:
  anything-llm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_3001:-3001}:3001"
    env_file:
      - .env
    environment:
      STORAGE_DIR: /app/server/storage
    volumes:
      - anythingllm_data:/app/server/storage

volumes:
  anythingllm_data:
