services:
  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_8080:-8080}:8080"
    environment:
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_PUBLIC_URL: ${NC_PUBLIC_URL:-http://localhost:8080}
      NC_INVITE_ONLY_SIGNUP: ${NC_INVITE_ONLY_SIGNUP:-false}
      NC_DISABLE_TELE: ${NC_DISABLE_TELE:-true}
      NC_SMTP_HOST: ${NC_SMTP_HOST:-}
      NC_SMTP_PORT: ${NC_SMTP_PORT:-587}
      NC_SMTP_USERNAME: ${NC_SMTP_USERNAME:-}
      NC_SMTP_PASSWORD: ${NC_SMTP_PASSWORD:-}
      NC_SMTP_FROM: ${NC_SMTP_FROM:-}
    volumes:
      - nocodb_data:/usr/app/data

volumes:
  nocodb_data:
