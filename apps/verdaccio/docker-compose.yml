services:
  verdaccio:
    image: verdaccio/verdaccio:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_4873:-4873}:4873"
    env_file:
      - .env
    environment:
      VERDACCIO_PORT: ${VERDACCIO_PORT:-4873}
      VERDACCIO_PROTOCOL: ${VERDACCIO_PROTOCOL:-http}
      VERDACCIO_PUBLIC_URL: ${VERDACCIO_PUBLIC_URL:-}
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - verdaccio_conf:/verdaccio/conf
      - verdaccio_plugins:/verdaccio/plugins

volumes:
  verdaccio_storage:
  verdaccio_conf:
  verdaccio_plugins:
