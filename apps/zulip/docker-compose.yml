services:
  zulip:
    image: zulip/docker-zulip:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_80:-8080}:80"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_HOST_PORT: "5432"
      DB_USER: zulip
      DISABLE_HTTPS: ${DISABLE_HTTPS:-True}
      SSL_CERTIFICATE_GENERATION: self-signed
      SETTING_MEMCACHED_LOCATION: memcached:11211
      SETTING_RABBITMQ_HOST: rabbitmq
      SETTING_REDIS_HOST: redis
      SECRETS_memcached_password: ${SECRETS_memcached_password}
    volumes:
      - zulip_data:/data
    depends_on:
      - postgres
      - memcached
      - rabbitmq
      - redis

  postgres:
    image: zulip/zulip-postgresql:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: ${SECRETS_postgres_password}
    volumes:
      - pgdata:/var/lib/postgresql/data

  memcached:
    image: memcached:alpine
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$MEMCACHED_PASSWORD" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$MEMCACHED_PASSWORD" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: /home/memcache/memcached.conf
      MEMCACHED_SASL_PWDB: /home/memcache/memcached-sasl-db
      MEMCACHED_PASSWORD: ${SECRETS_memcached_password}

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: ${SECRETS_rabbitmq_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:alpine
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo "requirepass '$$REDIS_PASSWORD'" > /etc/redis.conf
        exec redis-server /etc/redis.conf
    environment:
      REDIS_PASSWORD: ${SECRETS_redis_password}
    volumes:
      - redis_data:/data

volumes:
  zulip_data:
  pgdata:
  rabbitmq_data:
  redis_data:
