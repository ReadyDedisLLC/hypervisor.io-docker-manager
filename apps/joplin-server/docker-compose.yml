services:
  joplin:
    image: joplinapp/server:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_22300:-22300}:22300"
    env_file:
      - .env
    environment:
      DB_CLIENT: pg
      DATABASE_URL: postgresql://joplin:${POSTGRES_PASSWORD}@db:5432/joplin
      APP_PORT: ${APP_PORT:-22300}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:22300}
      MAILER_ENABLED: ${MAILER_ENABLED:-0}
      MAILER_HOST: ${MAILER_HOST:-}
      MAILER_PORT: ${MAILER_PORT:-465}
      MAILER_SECURITY: ${MAILER_SECURITY:-tls}
      MAILER_AUTH_USER: ${MAILER_AUTH_USER:-}
      MAILER_AUTH_PASSWORD: ${MAILER_AUTH_PASSWORD:-}
      MAILER_NOREPLY_EMAIL: ${MAILER_NOREPLY_EMAIL:-}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: joplin
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
