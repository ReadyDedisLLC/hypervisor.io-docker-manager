services:
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_8008:-8008}:8008"
      - "${HOST_PORT_8448:-8448}:8448"
    env_file:
      - .env
    environment:
      SYNAPSE_CONFIG_DIR: /data
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-localhost}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS:-no}
      SYNAPSE_LOG_LEVEL: ${SYNAPSE_LOG_LEVEL:-INFO}
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET:-}
      SYNAPSE_NO_TLS: ${SYNAPSE_NO_TLS:-true}
      SYNAPSE_ENABLE_REGISTRATION: ${SYNAPSE_ENABLE_REGISTRATION:-no}
      UID: ${UID:-991}
      GID: ${GID:-991}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - synapse_data:/data

volumes:
  synapse_data:
