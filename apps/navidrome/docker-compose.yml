services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_4533:-4533}:4533"
    env_file:
      - .env
    environment:
      ND_SCANSCHEDULE: ${ND_SCANSCHEDULE:-1h}
      ND_LOGLEVEL: ${ND_LOGLEVEL:-info}
      ND_SESSIONTIMEOUT: ${ND_SESSIONTIMEOUT:-24h}
      ND_BASEURL: ${ND_BASEURL:-}
      ND_ENABLETRANSCODINGCONFIG: ${ND_ENABLETRANSCODINGCONFIG:-false}
      ND_ENABLESHARING: ${ND_ENABLESHARING:-false}
      ND_DEFAULTTHEME: ${ND_DEFAULTTHEME:-Dark}
    volumes:
      - navidrome_data:/data
      - navidrome_music:/music:ro

volumes:
  navidrome_data:
  navidrome_music:
