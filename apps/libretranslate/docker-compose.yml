services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_5000:-5000}:5000"
    environment:
      LT_API_KEYS: ${LT_API_KEYS:-false}
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-}
      LT_CHAR_LIMIT: ${LT_CHAR_LIMIT:-}
      LT_REQ_LIMIT: ${LT_REQ_LIMIT:-}
      LT_SUGGESTIONS: ${LT_SUGGESTIONS:-false}
      LT_DISABLE_WEB_UI: ${LT_DISABLE_WEB_UI:-false}
    volumes:
      - lt_data:/home/libretranslate/.local

volumes:
  lt_data:
