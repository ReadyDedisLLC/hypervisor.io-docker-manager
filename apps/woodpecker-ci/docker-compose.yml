services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_8000:-8000}:8000"
    env_file:
      - .env
    environment:
      WOODPECKER_HOST: ${WOODPECKER_HOST:-http://localhost:8000}
      WOODPECKER_OPEN: ${WOODPECKER_OPEN:-true}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:-}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_GITHUB: ${WOODPECKER_GITHUB:-false}
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT:-}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET:-}
      WOODPECKER_GITEA: ${WOODPECKER_GITEA:-false}
      WOODPECKER_GITEA_URL: ${WOODPECKER_GITEA_URL:-}
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT:-}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET:-}
    volumes:
      - woodpecker_data:/var/lib/woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    restart: unless-stopped
    command: agent
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - woodpecker-server

volumes:
  woodpecker_data:
